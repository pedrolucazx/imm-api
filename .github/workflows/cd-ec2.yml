name: CD — Deploy (EC2)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-api-ec2
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: "Deploy to EC2 via SSM"
    runs-on: ubuntu-latest
    # Sem "environment:" de propósito — isso muda o claim `sub` do token OIDC
    # de repo:OWNER/REPO:ref:refs/heads/main para
    # repo:OWNER/REPO:environment:<nome>, o que não bate com o trust policy
    # do imm-github-oidc-role (escopado por branch/ref) e derruba o
    # sts:AssumeRoleWithWebIdentity com AccessDenied.

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::431715654897:role/imm-github-oidc-role
          aws-region: us-east-1

      - name: Deploy via SSM Run Command
        env:
          INSTANCE_ID: i-0e7e7c8d5567ab76a
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "imm-api deploy from ${{ github.sha }}" \
            --parameters "commands=[\"sudo -u ec2-user bash -lc 'cd /home/ec2-user/imm-api && git fetch --quiet && git reset --hard origin/main && npm ci && npm run build && if pm2 describe imm-api >/dev/null 2>&1; then pm2 restart imm-api; else pm2 start dist/index.js --name imm-api; fi && pm2 save'\"]" \
            --query "Command.CommandId" --output text)
          echo "Command ID: $COMMAND_ID"

          # aws ssm wait command-executed desiste em ~100s (5s x 20 tentativas,
          # fixo no botocore) — npm ci + build numa t3.micro pode levar mais
          # que isso. Polling próprio, até 8 min.
          STATUS=""
          for i in $(seq 1 48); do
            if ! STATUS_OUTPUT=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query "Status" --output text 2>&1); then
              if [[ "$STATUS_OUTPUT" == *"InvocationDoesNotExist"* ]]; then
                echo "Status ($i/48): Pending (invocation not ready)"
                sleep 10
                continue
              fi
              echo "$STATUS_OUTPUT" >&2
              exit 1
            fi
            STATUS="$STATUS_OUTPUT"
            echo "Status ($i/48): $STATUS"
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 10
          done

          case "$STATUS" in
            Success|Failed|Cancelled|TimedOut) ;;
            *)
              echo "SSM command still running after 8 minutes; cancelling..."
              aws ssm cancel-command --command-id "$COMMAND_ID" --instance-ids "$INSTANCE_ID"
              STATUS="Cancelled"
              ;;
          esac

          echo "--- stdout ---"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query "StandardOutputContent" --output text || true

          if [ "$STATUS" != "Success" ]; then
            echo "--- stderr ---"
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query "StandardErrorContent" --output text || true
            echo "Deploy failed with status: $STATUS"
            exit 1
          fi

      - name: Health check
        run: |
          for i in 1 2 3 4 5; do
            HEALTH=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 30 https://api.insidemymind.tech/health || echo "000")
            if [ "$HEALTH" = "200" ]; then
              echo "Health check passed (HTTP $HEALTH)"
              exit 0
            fi
            echo "Attempt $i failed (HTTP $HEALTH), retrying in 15s..."
            sleep 15
          done
          echo "Health check failed after 5 attempts"
          exit 1
